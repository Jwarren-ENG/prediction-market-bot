<!doctype html>
<html lang="en" data-type="software">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Track private Bitcoin and Central Park weather paper trials in Prediction Market Bot.">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#ffffff">
  <title>Research inbox · Prediction Market Bot</title>
  <link rel="icon" href="./mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to workspace</a>
  <header class="topbar">
    <div class="top-inner">
      <div class="brand">
        <img src="./mark.svg" alt="Prediction Market Bot" width="32" height="32">
        <label class="workspace-picker"><span class="sr-only">Trading workspace</span>
          <select id="strategy-desk">
            <option value="weather">Central Park weather</option>
            <option value="bitcoin">Bitcoin</option>
            <option value="options">Options · Coming soon</option>
          </select>
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        </label>
      </div>
      <nav id="navigation" aria-label="Workspace"></nav>
      <div class="paper-label"><span class="paper-mode-label"><span class="paper-icon" aria-hidden="true"></span>Paper trading</span><time id="desk-clock" aria-live="off" title="Current time · change time zone in Worker settings"></time></div>
    </div>
  </header>
  <main id="main" class="workspace" tabindex="-1">
    <div id="notices"></div>
    <div id="workspace"><h1>Research inbox</h1><p>Connecting to the research worker…</p></div>
    <noscript><p>Enable JavaScript to read the worker’s research and paper ledger.</p></noscript>
  </main>
  <footer id="statusbar" class="statusbar"></footer>
  <div id="announcement" role="status" class="sr-only"></div>
</body>
</html>
